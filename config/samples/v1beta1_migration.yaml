# The shortest correct Migration: a one-shot clone of everything.
# Worked examples of every other mode live in docs/examples/.
apiVersion: pgcopydb-operator.io/v1beta1
kind: Migration
metadata:
  labels:
    app.kubernetes.io/name: pgcopydb-operator
    app.kubernetes.io/managed-by: kustomize
  name: migration-sample
spec:
  source:
    host: shop.example.com
    database: shop
    username: migrator
    passwordSecretRef: {name: shop-source, key: password}
    sslMode: require
  target:
    host: shop-pg-rw.shop.svc
    database: shop
    username: app
    passwordSecretRef: {name: shop-pg-app, key: password}
