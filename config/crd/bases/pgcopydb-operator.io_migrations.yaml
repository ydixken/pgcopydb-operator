---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: migrations.pgcopydb-operator.io
spec:
  group: pgcopydb-operator.io
  names:
    kind: Migration
    listKind: MigrationList
    plural: migrations
    shortNames:
    - pgm
    singular: migration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Complete")].status
      name: Complete
      type: string
    - jsonPath: .status.replication.lagBytes
      name: Lag
      priority: 1
      type: integer
    - jsonPath: .status.attempts
      name: Attempts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: pgcopydb-operator.io/v1alpha1 Migration is deprecated; use
      v1beta1
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Migration is the Schema for the migrations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Migration
            properties:
              backoffLimit:
                default: 3
                description: |-
                  backoffLimit is the operator-level retry budget. Each attempt is a fresh
                  Job (backoffLimit 0) that resumes via the pgcopydb work directory.
                format: int32
                minimum: 0
                type: integer
              clone:
                description: clone configures the base copy.
                properties:
                  dropIfExists:
                    description: dropIfExists issues pg_restore --clean --if-exists
                      on the target.
                    type: boolean
                  estimateTableSizes:
                    description: |-
                      estimateTableSizes bases split decisions on pg_class page-count
                      estimates instead of exact size queries (--estimate-table-sizes). To
                      refresh those estimates pgcopydb first runs vacuumdb --analyze-only
                      (with tableJobs workers) on the SOURCE; add "analyze" to skip to leave
                      the source untouched and trust its existing statistics.
                    type: boolean
                  failFast:
                    description: failFast stops the whole run on the first failed
                      child (--fail-fast).
                    type: boolean
                  filters:
                    description: filters is rendered to the pgcopydb --filters INI
                      file.
                    properties:
                      excludeExtensions:
                        items:
                          type: string
                        type: array
                      excludeIndexes:
                        items:
                          type: string
                        type: array
                      excludeSchemas:
                        items:
                          type: string
                        type: array
                      excludeTableData:
                        items:
                          type: string
                        type: array
                      excludeTables:
                        items:
                          type: string
                        type: array
                      includeOnlyExtensions:
                        items:
                          type: string
                        type: array
                      includeOnlySchemas:
                        items:
                          type: string
                        type: array
                      includeOnlyTables:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: includeOnlyTables cannot be combined with excludeTables
                        or excludeSchemas
                      rule: '!(has(self.includeOnlyTables) && (has(self.excludeTables)
                        || has(self.excludeSchemas)))'
                    - message: includeOnlySchemas cannot be combined with excludeSchemas
                      rule: '!(has(self.includeOnlySchemas) && has(self.excludeSchemas))'
                    - message: includeOnlyExtensions cannot be combined with excludeExtensions
                      rule: '!(has(self.includeOnlyExtensions) && has(self.excludeExtensions))'
                  indexJobs:
                    description: |-
                      indexJobs is the number of concurrent CREATE INDEX workers (--index-jobs).
                      Unset leaves pgcopydb's default of four. Size it against the TARGET, not
                      the worker: pgcopydb sets maintenance_work_mem to 1GB per index worker,
                      overriding the server's own setting, so four jobs authorise 4GB there.
                    format: int32
                    minimum: 1
                    type: integer
                  largeObjectsJobs:
                    description: largeObjectsJobs is the number of concurrent large-object
                      workers.
                    format: int32
                    minimum: 1
                    type: integer
                  noACL:
                    description: noACL skips GRANT/REVOKE on restore (--no-acl).
                    type: boolean
                  noComments:
                    description: noComments skips COMMENT statements (--no-comments).
                    type: boolean
                  noOwner:
                    description: noOwner skips ALTER OWNER on restore (--no-owner).
                    type: boolean
                  noRolePasswords:
                    description: |-
                      noRolePasswords dumps roles without passwords (--no-role-passwords),
                      avoiding the superuser requirement of roles.
                    type: boolean
                  noTablespaces:
                    description: noTablespaces skips tablespace selection (--no-tablespaces).
                    type: boolean
                  restoreJobs:
                    description: restoreJobs is pg_restore --jobs (--restore-jobs);
                      0 follows indexJobs.
                    format: int32
                    minimum: 0
                    type: integer
                  roles:
                    description: |-
                      roles copies roles before the clone (--roles). Needs superuser on the
                      source unless noRolePasswords is also set.
                    type: boolean
                  skip:
                    description: skip lists base-copy sections to skip.
                    items:
                      description: |-
                        SkipOption names a section of the base copy to skip. Maps to pgcopydb
                        --skip-* flags; CDC (follow) is unaffected by these. extensionComments
                        (--skip-ext-comments) is already implied by extensions; list it alone to
                        install extensions but drop their COMMENT statements.
                      enum:
                      - largeObjects
                      - extensions
                      - extensionComments
                      - collations
                      - vacuum
                      - analyze
                      - dbProperties
                      - ctidSplit
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  splitMaxParts:
                    description: |-
                      splitMaxParts caps the number of parts per table (--split-max-parts).
                      Unset defaults to 8, so a very large table cannot fan out into hundreds
                      of parts and catalog rows.
                    format: int32
                    minimum: 0
                    type: integer
                  splitTablesLargerThan:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      splitTablesLargerThan enables same-table concurrency for tables at or
                      above this size (--split-tables-larger-than), rendered to bytes. Unset
                      defaults to 512Mi; pgcopydb itself ships this disabled, which leaves one
                      large table to a single worker however many table jobs are running.
                      Splitting needs a single-column integer key, or it falls back to ctid
                      ranges, and pgcopydb disables it silently when the source is a standby.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  tableJobs:
                    description: |-
                      tableJobs is the number of concurrent table COPY workers (pgcopydb
                      --table-jobs). Unset follows the worker's CPU request, minimum four. Each
                      job also gets a concurrent VACUUM ANALYZE backend on the target, so N
                      here means up to 2N target connections.
                    format: int32
                    minimum: 1
                    type: integer
                  useCopyBinary:
                    default: true
                    description: |-
                      useCopyBinary uses COPY WITH (FORMAT BINARY) (--use-copy-binary), which
                      is on by default. Text COPY encodes bytea as hex, two wire bytes per
                      data byte, and the worker relays every row between source and target, so
                      the cost lands on both legs. pgcopydb checks each table against the
                      source catalog and falls back to text for any table with a column whose
                      binary encoding is not safe, so this is per table rather than all or
                      nothing. Set it false to force text everywhere.

                      A pointer, and defaulted by the API server rather than by the operator,
                      because this is the only shape where all three states are expressible.
                      A plain bool cannot carry them: false is its zero value, so a Go client
                      that never touches the field still marshals "useCopyBinary": false, the
                      API server sees a value present and skips its default, and the setting
                      silently stays off for everyone not writing YAML by hand. nil with
                      omitempty leaves the key absent, which is what the default needs.
                    type: boolean
                type: object
              cutover:
                description: cutover controls how a live migration ends; ignored without
                  follow.
                properties:
                  approved:
                    description: |-
                      approved triggers the cutover in Manual mode. Mutable. Setting it back
                      to false after the cutover started has no effect.
                    type: boolean
                  mode:
                    default: Manual
                    description: mode selects Manual (default) or Automatic cutover.
                    enum:
                    - Manual
                    - Automatic
                    type: string
                type: object
              follow:
                description: |-
                  follow enables live migration (CDC after the base copy). Immutable:
                  a one-shot clone cannot become a live migration after the fact.
                properties:
                  allowMissingReplicaIdentity:
                    description: |-
                      allowMissingReplicaIdentity acknowledges tables that the preflight
                      replica-identity audit would otherwise fail on. Entries are
                      schema-qualified table names exactly as the preflight prints them
                      (schema.table, unquoted); the single entry "*" acknowledges every
                      offender. Acknowledged tables are reported as a warning instead of
                      failing the Migration. The risk stays: UPDATE or DELETE on such a
                      table during the migration window fails on the source at write time,
                      so acknowledge only tables that are read-only or insert-only while
                      the migration runs. Immutable with the rest of follow.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: entries must be non-empty table names (or "*")
                      rule: self.all(x, x != '')
                  enabled:
                    description: enabled turns the migration into a live one.
                    type: boolean
                  maxCatchupLag:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 16Mi
                    description: |-
                      maxCatchupLag is the replication lag under which the migration counts
                      as caught up (the CaughtUp condition and Automatic cutover trigger).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  plugin:
                    default: pgoutput
                    description: plugin is the logical decoding plugin (--plugin).
                    enum:
                    - pgoutput
                    - wal2json
                    - test_decoding
                    type: string
                  publication:
                    description: |-
                      publication names a pre-created publication (--publication); empty lets
                      pgcopydb create and drop its own.
                    type: string
                  replayNoOpUpdates:
                    description: |-
                      replayNoOpUpdates replays UPDATEs that change no columns
                      (--replay-no-op-updates), needed when target triggers must fire.
                    type: boolean
                  slotName:
                    description: |-
                      slotName overrides the replication slot name (--slot-name). Empty means
                      a generated name unique to this Migration; set it only when fanning
                      several migrations out of one source instance deliberately. The pattern
                      is PostgreSQL's own slot-name charset; the operator relies on it when
                      interpolating the name into SQL (origin verification, retry cleanup).
                    maxLength: 63
                    pattern: ^[a-z0-9_]+$
                    type: string
                  wal2jsonNumericAsString:
                    description: |-
                      wal2jsonNumericAsString makes wal2json emit numeric values as JSON
                      strings (--wal2json-numeric-as-string), preserving precision a JSON
                      number would lose. Only meaningful with plugin wal2json; admission
                      rejects it under any other plugin.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: follow is immutable
                  rule: self == oldSelf
                - message: 'wal2jsonNumericAsString configures the wal2json plugin
                    and does nothing under any other; set plugin: wal2json or drop
                    the field'
                  rule: '!(has(self.wal2jsonNumericAsString) && self.wal2jsonNumericAsString)
                    || (has(self.plugin) && self.plugin == ''wal2json'')'
              runner:
                description: runner configures the worker pod.
                properties:
                  affinity:
                    description: Affinity is a group of affinity scheduling rules.
                    properties:
                      nodeAffinity:
                        description: Describes node affinity scheduling rules for
                          the pod.
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            description: |-
                              The scheduler will prefer to schedule pods to nodes that satisfy
                              the affinity expressions specified by this field, but it may choose
                              a node that violates one or more of the expressions. The node that is
                              most preferred is the one with the greatest sum of weights, i.e.
                              for each node that meets all of the scheduling requirements (resource
                              request, requiredDuringScheduling affinity expressions, etc.),
                              compute a sum by iterating through the elements of this field and adding
                              "weight" to the sum if the node matches the corresponding matchExpressions; the
                              node(s) with the highest sum are the most preferred.
                            items:
                              description: |-
                                An empty preferred scheduling term matches all objects with implicit weight 0
                                (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                              properties:
                                preference:
                                  description: A node selector term, associated with
                                    the corresponding weight.
                                  properties:
                                    matchExpressions:
                                      description: A list of node selector requirements
                                        by node's labels.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
                                            type: array
                                            x-kubernetes-list-type: atomic
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    matchFields:
                                      description: A list of node selector requirements
                                        by node's fields.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
                                            type: array
                                            x-kubernetes-list-type: atomic
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                      x-kubernetes-list-type: atomic
                                  type: object
                                  x-kubernetes-map-type: atomic
                                weight:
                                  description: Weight associated with matching the
                                    corresponding nodeSelectorTerm, in the range 1-100.
                                  format: int32
                                  type: integer
                              required:
                              - preference
                              - weight
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          requiredDuringSchedulingIgnoredDuringExecution:
                            description: |-
                              If the affinity requirements specified by this field are not met at
                              scheduling time, the pod will not be scheduled onto the node.
                              If the affinity requirements specified by this field cease to be met
                              at some point during pod execution (e.g. due to an update), the system
                              may or may not try to eventually evict the pod from its node.
                            properties:
                              nodeSelectorTerms:
                                description: Required. A list of node selector terms.
                                  The terms are ORed.
                                items:
                                  description: |-
                                    A null or empty node selector term matches no objects. The requirements of
                                    them are ANDed.
                                    The TopologySelectorTerm type implements a subset of the NodeSelectorTerm.
                                  properties:
                                    matchExpressions:
                                      description: A list of node selector requirements
                                        by node's labels.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
                                            type: array
                                            x-kubernetes-list-type: atomic
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    matchFields:
                                      description: A list of node selector requirements
                                        by node's fields.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
                                            type: array
                                            x-kubernetes-list-type: atomic
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                      x-kubernetes-list-type: atomic
                                  type: object
                                  x-kubernetes-map-type: atomic
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - nodeSelectorTerms
                            type: object
                            x-kubernetes-map-type: atomic
                        type: object
                      podAffinity:
                        description: Describes pod affinity scheduling rules (e.g.
                          co-locate this pod in the same node, zone, etc. as some
                          other pod(s)).
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            description: |-
                              The scheduler will prefer to schedule pods to nodes that satisfy
                              the affinity expressions specified by this field, but it may choose
                              a node that violates one or more of the expressions. The node that is
                              most preferred is the one with the greatest sum of weights, i.e.
                              for each node that meets all of the scheduling requirements (resource
                              request, requiredDuringScheduling affinity expressions, etc.),
                              compute a sum by iterating through the elements of this field and adding
                              "weight" to the sum if the node has pods which matches the corresponding podAffinityTerm; the
                              node(s) with the highest sum are the most preferred.
                            items:
                              description: The weights of all of the matched WeightedPodAffinityTerm
                                fields are added per-node to find the most preferred
                                node(s)
                              properties:
                                podAffinityTerm:
                                  description: Required. A pod affinity term, associated
                                    with the corresponding weight.
                                  properties:
                                    labelSelector:
                                      description: |-
                                        A label query over a set of resources, in this case pods.
                                        If it's null, this PodAffinityTerm matches with no Pods.
                                      properties:
                                        matchExpressions:
                                          description: matchExpressions is a list
                                            of label selector requirements. The requirements
                                            are ANDed.
                                          items:
                                            description: |-
                                              A label selector requirement is a selector that contains values, a key, and an operator that
                                              relates the key and values.
                                            properties:
                                              key:
                                                description: key is the label key
                                                  that the selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  operator represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                                type: string
                                              values:
                                                description: |-
                                                  values is an array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. This array is replaced during a strategic
                                                  merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          description: |-
                                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                                          type: object
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    matchLabelKeys:
                                      description: |-
                                        MatchLabelKeys is a set of pod label keys to select which pods will
                                        be taken into consideration. The keys are used to lookup values from the
                                        incoming pod labels, those key-value labels are merged with `labelSelector` as `key in (value)`
                                        to select the group of existing pods which pods will be taken into consideration
                                        for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming
                                        pod labels will be ignored. The default value is empty.
                                        The same key is forbidden to exist in both matchLabelKeys and labelSelector.
                                        Also, matchLabelKeys cannot be set when labelSelector isn't set.
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    mismatchLabelKeys:
                                      description: |-
                                        MismatchLabelKeys is a set of pod label keys to select which pods will
                                        be taken into consideration. The keys are used to lookup values from the
                                        incoming pod labels, those key-value labels are merged with `labelSelector` as `key notin (value)`
                                        to select the group of existing pods which pods will be taken into consideration
                                        for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming
                                        pod labels will be ignored. The default value is empty.
                                        The same key is forbidden to exist in both mismatchLabelKeys and labelSelector.
                                        Also, mismatchLabelKeys cannot be set when labelSelector isn't set.
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    namespaceSelector:
                                      description: |-
                                        A label query over the set of namespaces that the term applies to.
                                        The term is applied to the union of the namespaces selected by this field
                                        and the ones listed in the namespaces field.
                                        null selector and null or empty namespaces list means "this pod's namespace".
                                        An empty selector ({}) matches all namespaces.
                                      properties:
                                        matchExpressions:
                                          description: matchExpressions is a list
                                            of label selector requirements. The requirements
                                            are ANDed.
                                          items:
                                            description: |-
                                              A label selector requirement is a selector that contains values, a key, and an operator that
                                              relates the key and values.
                                            properties:
                                              key:
                                                description: key is the label key
                                                  that the selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  operator represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                                type: string
                                              values:
                                                description: |-
                                                  values is an array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. This array is replaced during a strategic
                                                  merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        matchLabels:
                                          additionalProperties:
                                            type: string
                                          description: |-
                                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                                          type: object
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    namespaces:
                                      description: |-
                                        namespaces specifies a static list of namespace names that the term applies to.
                                        The term is applied to the union of the namespaces listed in this field
                                        and the ones selected by namespaceSelector.
                                        null or empty namespaces list and null namespaceSelector means "this pod's namespace".
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    topologyKey:
                                      description: |-
                                        This pod should be co-located (affinity) or not co-located (anti-affinity) with the pods matching
                                        the labelSelector in the specified namespaces, where co-located is defined as running on a node
                                        whose value of the label with key topologyKey matches that of any node on which any of the
                                        selected pods is running.
