extends: default

# config/ is the kubebuilder-generated kustomize tree; controller-gen owns its
# style and regenerates it, so we do not lint it by hand.
ignore:
  - config/

rules:
  document-start:
    present: false  # standalone config files; a --- header adds nothing
  line-length:
    max: 140  # digest-pinned image refs and commented CI lines overflow 80 by design
  truthy:
    check-keys: false  # GitHub workflow files use the bare `on:` key, which default truthy flags
