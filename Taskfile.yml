# Task runner for the pgcopydb-operator harness. Deliberately a Taskfile, not a
# Makefile: kubebuilder owns the Makefile it generates at scaffold time, and
# keeping it pristine keeps upstream diffs clean. Once the scaffold lands,
# `test` delegates to `make test` (envtest setup lives there); this file stays
# the human/agent entrypoint.
version: "3"

set: [pipefail]

tasks:
  help:
    desc: List all tasks.
    aliases: [default]
    cmds:
      - task --list-all

  lint:
    desc: Lint everything (yamllint, then kubebuilder's make lint for Go).
    cmds:
      - yamllint --strict .
      # The chart embeds generated artifacts (CRD, RBAC); these fail on drift.
      - ./hack/sync-chart-crd.sh --check
      - ./hack/sync-chart-rbac.sh --check
      # yamllint skips charts/*/templates/ (Go template syntax); helm covers it.
      # helm lint only renders the defaults, so the RBAC check renders the
      # value combinations that decide what the chart grants.
      - cmd: |-
          if command -v helm >/dev/null; then
            helm lint charts/pgcopydb-operator && ./hack/check-chart-rbac.sh && ./hack/check-chart-monitoring.sh
          else
            echo "lint: no helm, skipping chart lint"
          fi
      # A link into a directory mkdocs excludes renders dead on the site, and
      # mkdocs caps that message at INFO, so --strict cannot fail on it.
      - ./hack/check-docs-links.sh
      # yamllint proves a workflow is YAML, not that it is a workflow. A step
      # that lost its `uses:` is still valid YAML, and release.yml only runs on
      # a tag, so one shipped broken and nothing noticed until the next release
      # would have failed. actionlint reads the schema and the expressions, and
      # runs shellcheck over every run: block.
      - cmd: |-
          if command -v actionlint >/dev/null; then
            actionlint
          else
            echo "lint: no actionlint, skipping workflow lint"
          fi
      # The alert rules are checked and unit-tested with the promtool of the
      # Prometheus version they are written for.
      - ./hack/ensure-promtool.sh
      - bin/promtool check rules charts/pgcopydb-operator/rules/migrations.yaml
      - bin/promtool test rules test/alerts/migrations_test.yaml
      - cmd: |-
          if [ -f Makefile ]; then make lint; else echo "lint: no Makefile yet, skipping Go lint"; fi

  test:
    desc: Run unit tests (delegates to kubebuilder's make test once scaffolded).
    cmds:
      - cmd: |-
          if [ -f Makefile ]; then make test; else echo "test: no Go module yet, nothing to test"; fi

  docs:
    desc: Regenerate the CRD reference (docs/reference/api.md) from the Go API types.
    cmds:
      - GOBIN=$(pwd)/bin go install github.com/elastic/crd-ref-docs@v0.3.0
      - >-
        bin/crd-ref-docs --source-path=api/v1beta1
        --config=hack/crd-ref-docs.yaml --renderer=markdown
        --output-path=docs/reference/api.md

  e2e:
    desc: >-
      Run e2e tests against the CURRENT kubectl context (a real cluster).
      This task is local only; trusted feature PR and release candidate CI
      invoke the same specs directly. Confirms the context before running.
      E2E_SCALE (default 1, ~12GB seeded data) sizes the fixtures and their
      volumes, which are provisioned once per CNPG instance (one per cluster
      by default). Chaos scenarios are excluded; use e2e:chaos for those.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    prompt: >-
      e2e will run against kubectl context '{{.KUBE_CONTEXT}}', a real
      cluster. Continue?
    preconditions:
      - sh: test -d test/e2e
        msg: "No e2e tests yet. They arrive with the kubebuilder scaffold under test/e2e/."
    cmds:
      # -ginkgo.timeout must match -timeout: Ginkgo's own suite timeout
      # defaults to 1h and would abort long tiers mid-run otherwise.
      - go test ./test/e2e/... -v -timeout 3h -ginkgo.v -ginkgo.timeout=3h -ginkgo.label-filter='!chaos'

  e2e:focus:
    desc: >-
      Run ONE e2e spec against the CURRENT kubectl context, selected by Ginkgo
      focus regex. For iterating on a single failing scenario. FOCUS is
      required. Defaults differ from e2e on purpose: scale 0.1 and kept
      fixtures make a repeat run start in seconds rather than reseeding, and
      namespaces are left alone because on the shared dev cluster teardown
      would delete the Argo-provisioned system namespace. Override with
      SCALE=, KEEP=, MANAGE_NS=.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    prompt: >-
      e2e (focus "{{.FOCUS}}") will run against kubectl context
      '{{.KUBE_CONTEXT}}', a real cluster. Continue?
    preconditions:
      - sh: test -n '{{.FOCUS}}'
        msg: |
          FOCUS is required, for example:
            task e2e:focus FOCUS='loses no committed transaction'
    cmds:
      - task: e2e:focus:run
        vars: {FOCUS: '{{.FOCUS}}', SCALE: '{{.SCALE}}', KEEP: '{{.KEEP}}', MANAGE_NS: '{{.MANAGE_NS}}'}

  e2e:focus:unattended:
    desc: >-
      e2e:focus without the confirmation prompt, for an agent or a script that
      cannot answer one. EXPECT_CONTEXT is required and must name the current
      kubectl context: the prompt exists to stop a run reaching the wrong
      cluster, so removing it means saying which cluster you meant. Everything
      else behaves as e2e:focus.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    preconditions:
      - sh: test -n '{{.FOCUS}}'
        msg: |
          FOCUS is required, for example:
            task e2e:focus:unattended FOCUS='...' EXPECT_CONTEXT=my-cluster
      - sh: test '{{.EXPECT_CONTEXT}}' = '{{.KUBE_CONTEXT}}'
        msg: |
          EXPECT_CONTEXT must name the context this will run against.
            current context: {{.KUBE_CONTEXT}}
            EXPECT_CONTEXT : {{.EXPECT_CONTEXT | default "(unset)"}}
    cmds:
      - task: e2e:focus:run
        vars: {FOCUS: '{{.FOCUS}}', SCALE: '{{.SCALE}}', KEEP: '{{.KEEP}}', MANAGE_NS: '{{.MANAGE_NS}}'}

  e2e:focus:run:
    internal: true
    env:
      E2E_SCALE: '{{.SCALE | default "0.1"}}'
      E2E_KEEP_FIXTURES: '{{.KEEP | default "true"}}'
      E2E_MANAGE_NAMESPACES: '{{.MANAGE_NS | default "false"}}'
    cmds:
      - go test ./test/e2e/... -v -timeout 1h -ginkgo.v -ginkgo.timeout=1h
        -ginkgo.label-filter='!chaos' -ginkgo.focus='{{.FOCUS}}'

  e2e:chaos:
    desc: >-
      Chaos e2e (pod kills, disk pressure, concurrent migrations; the specs
      labeled "chaos") against the CURRENT kubectl context. Local only.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    prompt: >-
      e2e CHAOS (kills fixture pods, fills volumes) will run against kubectl
      context '{{.KUBE_CONTEXT}}', a real cluster. Continue?
    preconditions:
      - sh: test -d test/e2e
        msg: "No e2e tests yet. They arrive with the kubebuilder scaffold under test/e2e/."
    cmds:
      - go test ./test/e2e/... -v -timeout 3h -ginkgo.v -ginkgo.timeout=3h -ginkgo.label-filter='chaos'

  e2e:matrix:
    desc: >-
      PG version-matrix e2e against the CURRENT kubectl context: the full
      suite (chaos excluded) once per combo 14->18, 18->18, 15->17, each at
      E2E_SCALE=0.1, fixtures kept between combos. A failing combo does not
      stop the later ones; the task prints a summary and exits nonzero if
      any combo failed. Local only.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    prompt: >-
      e2e MATRIX (three sequential full-suite runs, PG 14->18, 18->18,
      15->17, about two hours) will run against kubectl context
      '{{.KUBE_CONTEXT}}', a real cluster. Continue?
    preconditions:
      - sh: test -d test/e2e
        msg: "No e2e tests yet. They arrive with the kubebuilder scaffold under test/e2e/."
    cmds:
      - ./hack/e2e-matrix.sh

  e2e:stress:
    desc: >-
      Stress e2e (E2E_STRESS=true, scale 10, ~120GB fixtures per instance)
      against the CURRENT kubectl context. When E2E_STORAGE_CLASS is unset and
      the suite-owned path is selected, the suite creates and capacity-checks
      its ephemeral StorageClass; callers that supply an existing class use it
      and skip suite-owned setup and capacity checking. Local only.
    vars:
      KUBE_CONTEXT:
        sh: kubectl config current-context
    prompt: >-
      e2e STRESS (~120GB seeded data, hours of runtime) will run against
      kubectl context '{{.KUBE_CONTEXT}}', a real cluster. Continue?
    preconditions:
      - sh: test -d test/e2e
        msg: "No e2e tests yet. They arrive with the kubebuilder scaffold under test/e2e/."
    cmds:
      - E2E_STRESS=true go test ./test/e2e/... -v -timeout 8h -ginkgo.v -ginkgo.timeout=8h -ginkgo.label-filter='!chaos'
