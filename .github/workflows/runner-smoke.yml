name: Runner smoke

# Proves the cluster runner scale set is registered and can build images,
# without cutting a release tag. Manual only: the runner is a self-hosted
# machine on a private cluster and this repository is public, so nothing
# a fork can trigger may ever reach it.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v7
      - name: Report the daemon the dind sidecar provides
        run: |
          docker version
          docker buildx version
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The buildx layer cache goes on the node, next to the Go caches, rather
      # than through GitHub's cache service. Empty on a hosted runner, where
      # buildx then simply builds cold.
      - id: cache
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/buildx-runner
          [ -O /cache/buildx-runner ] || sudo chown "$(id -u):$(id -g)" /cache/buildx-runner
          echo "dir=/cache/buildx-runner" >> "$GITHUB_OUTPUT"
      - name: Build both platforms without pushing
        # The runner base is now the pgcopydb-builder image (private, ghcr.io),
        # so this needs the login above or it fails at pull access denied; the
        # heavy compile that used to need QEMU here left with it.
        uses: docker/build-push-action@v7
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: ${{ steps.cache.outputs.dir && format('type=local,src={0}', steps.cache.outputs.dir) || '' }}
          cache-to: ${{ steps.cache.outputs.dir && format('type=local,dest={0},mode=max', steps.cache.outputs.dir) || '' }}
