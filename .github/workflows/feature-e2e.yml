name: Feature E2E

"on":
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository pull request number
        required: true
        type: string
      mode:
        description: Full merge gate or one focused diagnostic
        required: true
        default: full
        type: choice
        options: [full, focus]
      scale:
        description: Fixture scale multiplier
        required: true
        default: "0.1"
        type: choice
        options: ["0.1", "1.0"]
      focus:
        description: Ginkgo focus expression, required only for focus mode
        required: false
        default: ""
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  MANAGER_IMAGE: ghcr.io/${{ github.repository }}
  RUNNER_IMAGE: ghcr.io/${{ github.repository }}/runner

jobs:
  resolve:
    if: github.repository == 'ydixken/pgcopydb-operator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, pull-requests: read}
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      focus: ${{ steps.resolve.outputs.focus }}
      scale: ${{ steps.resolve.outputs.scale }}
    steps:
      - name: Resolve pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FOCUS: ${{ inputs.focus }}
          INPUT_SCALE: ${{ inputs.scale }}
        run: |
          set -euo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be positive"; exit 1; }
          case "$INPUT_MODE" in
            full) [ -z "$INPUT_FOCUS" ] || { echo "::error::focus must be empty for full"; exit 1; } ;;
            focus) case "$INPUT_FOCUS" in *[![:space:]]*) ;; *) echo "::error::focus is required"; exit 1 ;; esac ;;
            *) echo "::error::mode must be full or focus"; exit 1 ;;
          esac
          case "$INPUT_SCALE" in
            0.1 | 1.0) ;;
            *) echo "::error::scale must be 0.1 or 1.0"; exit 1 ;;
          esac
          sanitized=$(printf '%s' "$INPUT_FOCUS" | LC_ALL=C tr -d '\000-\037\177')
          [ "$sanitized" = "$INPUT_FOCUS" ] || { echo "::error::focus contains a control character"; exit 1; }
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR}")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "main" and
            .base.repo.full_name == $repo and .head.repo.full_name == $repo
          ' <<<"$pr_json" >/dev/null || { echo "::error::pull request is not trusted"; exit 1; }
          sha=$(jq -er '.head.sha' <<<"$pr_json")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head is not a full SHA"; exit 1; }
          printf 'pr=%s\nsha=%s\nmode=%s\nfocus=%s\nscale=%s\n' \
            "$INPUT_PR" "$sha" "$INPUT_MODE" "$INPUT_FOCUS" "$INPUT_SCALE" >> "$GITHUB_OUTPUT"

  pending-status:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {statuses: write}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_MODE: ${{ needs.resolve.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          context=feature-e2e
          [ "$RUN_MODE" = focus ] && context=feature-e2e/focus
          description='Feature e2e is running'
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="$context" \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null

  preflight:
    needs: [resolve, pending-status]
    runs-on: github-runner-pgcopydb-operator
    timeout-minutes: 30
    permissions: {contents: read, packages: read}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check candidate compatibility
        id: compatibility
        run: |
          set -euo pipefail
          make -C candidate -f ../trusted/Makefile manifests
          (
            cd candidate
            generated_drift=$(git status --porcelain -- config/crd/bases config/rbac)
            [ -z "$generated_drift" ] || {
              echo "::error::generated CRD or RBAC files are stale"
              exit 1
            }
            ../trusted/hack/sync-chart-crd.sh --check
            ../trusted/hack/sync-chart-rbac.sh --check
          )
          (
            cd trusted
            FEATURE_E2E_BASE="$GITHUB_WORKSPACE/trusted" \
            FEATURE_E2E_HEAD="$GITHUB_WORKSPACE/candidate" \
            FEATURE_E2E_HELM="$(command -v helm)" \
              go test ./test/buildconfig \
                -run '^TestFeatureE2ECandidateCompatibility$' -count=1
          )
          builder_ref() {
            local file=$1
            local image='ghcr\.io/ydixken/pgcopydb-operator/pgcopydb-builder'
            [ "$(grep -c '^FROM .*pgcopydb-builder:' "$file")" -eq 1 ]
            sed -nE \
              "s|^FROM (${image}:[^[:space:]]+@sha256:[0-9a-f]{64}) AS pgcopydb$|\1|p" \
              "$file"
          }
          trusted_ref=$(builder_ref trusted/images/runner/Dockerfile)
          candidate_ref=$(builder_ref candidate/images/runner/Dockerfile)
          [ -n "$trusted_ref" ]
          [ "$candidate_ref" = "$trusted_ref" ]
          docker buildx imagetools inspect "$candidate_ref" >/dev/null

  manager-image:
    needs: [resolve, preflight]
    runs-on: github-runner-pgcopydb-operator
    timeout-minutes: 90
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push manager
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MANAGER_IMAGE }}:feature-${{ needs.resolve.outputs.sha }}
          build-args: VERSION=feature-${{ needs.resolve.outputs.sha }}

  runner-image:
    needs: [resolve, preflight]
    runs-on: github-runner-pgcopydb-operator
    timeout-minutes: 150
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runner
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.RUNNER_IMAGE }}:feature-${{ needs.resolve.outputs.sha }}

  cluster:
    needs: [resolve, preflight, manager-image, runner-image]
    runs-on: github-runner-pgcopydb-e2e
    environment: e2e-cluster
    timeout-minutes: 300
    permissions: {contents: read, packages: read}
    concurrency:
      group: e2e-cluster
      cancel-in-progress: false
    outputs:
      suite: ${{ steps.suite.outcome }}
      cleanup: ${{ steps.cleanup.outcome }}
      suite_ran: ${{ steps.suite.outputs.suite_ran }}
      suite_completed: ${{ steps.suite.outputs.suite_completed }}
      manager_attested: ${{ steps.suite.outputs.manager_attested }}
      runner_attested: ${{ steps.runner-attestation.outputs.runner_attested }}
    env:
      E2E_OPERATOR_NAMESPACE: pgcopydb-e2e
      MANAGER_REF: ghcr.io/${{ github.repository }}:feature-${{ needs.resolve.outputs.sha }}@${{ needs.manager-image.outputs.digest }}
      RUNNER_REF: ghcr.io/${{ github.repository }}/runner:feature-${{ needs.resolve.outputs.sha }}@${{ needs.runner-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Check out trusted feature scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: feature-e2e-trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Require exclusive controller policy
        env:
          E2E_EXCLUSIVE_CONTROLLER: ${{ vars.E2E_EXCLUSIVE_CONTROLLER }}
        run: |
          set -euo pipefail
          [ "$E2E_EXCLUSIVE_CONTROLLER" = "true" ] || {
            echo "::error::exclusive controller policy is not attested"
            exit 1
          }
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mask and confirm Kubernetes context
        env:
          E2E_EXPECT_CONTEXT: ${{ secrets.E2E_EXPECT_CONTEXT }}
        run: |
          set -euo pipefail
          [ -n "$E2E_EXPECT_CONTEXT" ] || {
            echo "::error::expected Kubernetes context is not configured"
            exit 1
          }
          printf '::add-mask::%s\n' "$E2E_EXPECT_CONTEXT"
          actual=$(kubectl config current-context)
          [ -n "$actual" ] || {
            echo "::error::Kubernetes context is empty"
            exit 1
          }
          printf '::add-mask::%s\n' "$actual"
          [ "$actual" = "$E2E_EXPECT_CONTEXT" ] || {
            echo "::error::Kubernetes context mismatch"
            exit 1
          }
      - name: Validate immutable inputs
        env:
          E2E_PROMETHEUS_URL: ${{ secrets.E2E_PROMETHEUS_URL }}
        run: |
          set -euo pipefail
          set +x
          printf '::add-mask::%s\n' "$E2E_PROMETHEUS_URL"
          [ -n "$E2E_PROMETHEUS_URL" ] || {
            echo "::error::Prometheus URL is not configured"
            exit 1
          }
          [ "$E2E_OPERATOR_NAMESPACE" = pgcopydb-e2e ] || {
            echo "::error::feature operator namespace is invalid"
            exit 1
          }
          [[ "$MANAGER_REF" =~ ^ghcr\.io/ydixken/pgcopydb-operator:feature-[0-9a-f]{40}@sha256:[0-9a-f]{64}$ ]]
          [[ "$RUNNER_REF" =~ ^ghcr\.io/ydixken/pgcopydb-operator/runner:feature-[0-9a-f]{40}@sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$MANAGER_REF" >/dev/null
          docker buildx imagetools inspect "$RUNNER_REF" >/dev/null
      - name: Write cluster helpers
        id: helpers
        run: bash feature-e2e-trusted/hack/feature-e2e-helpers.sh
      - name: Require an empty feature slot
        run: |
          set -euo pipefail
          releases=$("$REAL_HELM" list -n "$E2E_OPERATOR_NAMESPACE" -q \
            --filter '^pgcopydb-e2e$')
          [ -z "$releases" ] || {
            echo "::error::feature controller slot is occupied"
            exit 1
          }
          canary=$(kubectl get job feature-e2e-runner-attest -n pgcopydb-e2e \
            --ignore-not-found -o name)
          [ -z "$canary" ] || {
            echo "::error::feature runner slot is occupied"
            exit 1
          }
      - name: Attest runner image
        id: runner-attestation
        run: |
          set -euo pipefail
          owner_value=$(<"$FEATURE_E2E_OWNER_FILE")
          [[ "$owner_value" =~ ^[0-9a-f]{32}$ ]]
          kubectl apply -f - >/dev/null <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: feature-e2e-runner-attest
            namespace: pgcopydb-e2e
            labels:
              $FEATURE_E2E_OWNER_KEY: $owner_value
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: feature-e2e-runner-attest
                  $FEATURE_E2E_OWNER_KEY: $owner_value
              spec:
                automountServiceAccountToken: false
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  seccompProfile: {type: RuntimeDefault}
                containers:
                  - name: runner
                    image: $RUNNER_REF
                    imagePullPolicy: IfNotPresent
                    command: [pgcopydb, --version]
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: {drop: [ALL]}
          EOF
          kubectl wait job/feature-e2e-runner-attest -n pgcopydb-e2e \
            --for=condition=complete --timeout=2m >/dev/null
          "$FEATURE_E2E_HELPERS/attest-image" runner
          printf 'runner_attested=true\n' >> "$GITHUB_OUTPUT"
      - name: Run non-chaos suite
        id: suite
        continue-on-error: true
        env:
          RUN_MODE: ${{ needs.resolve.outputs.mode }}
          E2E_FOCUS: ${{ needs.resolve.outputs.focus }}
          E2E_OPERATOR_TAG: feature-${{ needs.resolve.outputs.sha }}@${{ needs.manager-image.outputs.digest }}
          E2E_RUNNER_TAG: feature-${{ needs.resolve.outputs.sha }}@${{ needs.runner-image.outputs.digest }}
          E2E_SCALE: ${{ needs.resolve.outputs.scale }}
          E2E_MANAGE_NAMESPACES: "false"
          E2E_KEEP_FIXTURES: "true"
          E2E_STORAGE_CLASS: ${{ vars.E2E_STORAGE_CLASS }}
          E2E_PROMETHEUS_URL: ${{ secrets.E2E_PROMETHEUS_URL }}
        run: bash feature-e2e-trusted/hack/feature-e2e-suite.sh
      - name: Cleanup feature resources
        id: cleanup
        if: always()
        env:
          HELPERS_OUTCOME: ${{ steps.helpers.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail
          case "$HELPERS_OUTCOME" in
            success)
              case "$SUITE_OUTCOME" in
                success) "$FEATURE_E2E_HELPERS/cleanup" ;;
                failure | skipped | cancelled) "$FEATURE_E2E_HELPERS/cleanup" recovery ;;
                *) echo "::error::suite outcome is invalid for cleanup"; exit 1 ;;
              esac
              ;;
            skipped | failure) ;;
            *) echo "::error::cluster helper outcome is invalid"; exit 1 ;;
          esac
      - name: Require suite and cleanup success
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          [ "$SUITE_OUTCOME" = success ] && [ "$CLEANUP_OUTCOME" = success ]

  final-status:
    needs:
      - resolve
      - pending-status
      - preflight
      - manager-image
      - runner-image
      - cluster
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {statuses: write}
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_MODE: ${{ needs.resolve.outputs.mode }}
          CLUSTER_RESULT: ${{ needs.cluster.result }}
          CLUSTER_OUTPUTS: ${{ toJSON(needs.cluster.outputs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          context=feature-e2e
          [ "$RUN_MODE" = focus ] && context=feature-e2e/focus
          state=$(jq -er --arg result "$CLUSTER_RESULT" '
              if type == "object" and .cleanup == "success" and
                 .suite_ran == "true" and .suite_completed == "true" and
                 .manager_attested == "true" and .runner_attested == "true"
              then
                if $result == "success" and .suite == "success" then "success"
                elif $result == "failure" and .suite == "failure" then "failure"
                else "error" end
              else "error" end
            ' <<<"$CLUSTER_OUTPUTS" 2>/dev/null) || state=error
          case "$state" in
            success) description='Feature e2e passed' ;;
            failure) description='Feature e2e assertions failed' ;;
            *) state=error; description='Feature e2e could not complete safely' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$context" \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null
