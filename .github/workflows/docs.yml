name: Docs

# Builds the mkdocs site and deploys it to GitHub Pages through the Pages
# API (actions/deploy-pages). Deliberately NOT `mkdocs gh-deploy`: that
# commits the built site to a gh-pages branch, which the mirror would then
# carry to GitLab on every deploy. Requires the repo's Pages source set to
# "GitHub Actions" (one-time setting).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - PREREQUISITES.md
      - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the CRD reference is current
        # Same generation as `task docs` (keep the source path in sync with
        # the Taskfile docs task); a diff means the API changed without
        # regenerating docs/reference/api.md.
        run: |
          GOBIN=$(pwd)/bin go install github.com/elastic/crd-ref-docs@v0.3.0
          bin/crd-ref-docs --source-path=api/v1beta1 --config=hack/crd-ref-docs.yaml \
            --renderer=markdown --output-path=docs/reference/api.md
          git diff --exit-code docs/reference/api.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mkdocs-material==9.7.7
      - name: Build the site
        # --strict turns warnings (broken links, orphaned pages) into errors.
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
