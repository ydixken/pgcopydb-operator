name: Docs

# Builds the mkdocs site and deploys it to GitHub Pages through the Pages
# API (actions/deploy-pages). Deliberately NOT `mkdocs gh-deploy`: that
# commits the built site to a gh-pages branch, which the mirror would then
# carry to GitLab on every deploy. Requires the repo's Pages source set to
# "GitHub Actions" (one-time setting).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - PREREQUISITES.md
      - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: github-runner-pgcopydb-operator
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the CRD reference is current
        # Same generation as `task docs` (keep the source path in sync with
        # the Taskfile docs task); a diff means the API changed without
        # regenerating docs/reference/api.md.
        run: |
          # The runner image bakes this at the version the Taskfile pins; a
          # hosted runner, which is what a fork's pull request gets, installs it.
          tool="${LOCALBIN:-$(pwd)/bin}/crd-ref-docs"
          [ -x "$tool" ] || GOBIN="$(dirname "$tool")" go install github.com/elastic/crd-ref-docs@v0.3.0
          "$tool" --source-path=api/v1beta1 --config=hack/crd-ref-docs.yaml \
            --renderer=markdown --output-path=docs/reference/api.md
          git diff --exit-code docs/reference/api.md
      # The runner image carries mkdocs-material at this pin; a system python
      # refuses a system-wide install under PEP 668 in any case.
      - run: command -v mkdocs >/dev/null || pip install mkdocs-material==9.7.7
      - name: Build the site
        # --strict turns warnings (broken links, orphaned pages) into errors.
        run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
