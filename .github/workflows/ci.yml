name: CI

# Lint, test and build the docs on every push and pull request. These three
# jobs are the required checks on main, so this is the gate a pull request has
# to pass.
#
# Deliberately not here: the image build, which release.yml owns, and the e2e
# suite. E2e does run in CI, but on a release candidate rather than per
# commit: it needs the published images to install, it takes the better part
# of an hour, and it drives real workloads on a shared cluster.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: yamllint
        run: pipx install yamllint && yamllint --strict .
      - name: Chart CRD is current
        # The chart embeds controller-gen output; this fails on drift.
        run: ./hack/sync-chart-crd.sh --check
      - name: helm lint
        run: helm lint charts/pgcopydb-operator
      - name: golangci-lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit and envtest suites
        # make test downloads the envtest control-plane binaries itself.
        run: make test
      - name: Coverage total
        run: go tool cover -func=cover.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
      # Codecov requires a token even for a public repo: a tokenless upload is
      # rejected with "Token required - not valid tokenless upload". Skipped
      # outright when no CODECOV_TOKEN secret is set, so the absence is visible
      # as a skipped step rather than a green job that uploaded nothing; when
      # the secret is set, a failed upload fails the job rather than lying.
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out
          fail_ci_if_error: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: mkdocs build --strict
        # Pinned to match the docs deploy workflow; a Renovate custom manager
        # bumps both together.
        run: pip install mkdocs-material==9.7.7 && mkdocs build --strict
