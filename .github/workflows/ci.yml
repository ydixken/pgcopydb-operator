name: CI

# Lint, test and build the docs on every push and pull request: these three
# jobs are the required checks on main. Not here are the image build, which
# release.yml owns, and e2e, which runs against a release candidate because it
# needs published images and drives real workloads on a shared cluster. Actions
# has no YAML anchors, so all three jobs repeat the same runs-on expression and
# the same cache steps; each rule below is stated here once instead.
#
# Runner selection.
# Self-hosted for our own runs, hosted for a fork's: code from a fork must
# never reach the cluster runner, and runner-smoke.yml states the same rule.
# A push has no pull_request payload, so the expression falls through to the
# cluster runner there.
#
# The cache volume. /cache is a directory on the node the runner landed on, so
# it is warm per node rather than per scale set; a fork's pull request lands on
# a hosted runner, which has no such path and runs cold. The free-space guard
# protects the node itself, since filling that disk takes out every pod on the
# box and a cold cache is the far cheaper failure. df rather than du, and the
# chown guarded, because the directory holds hundreds of thousands of files
# that walking would cost. Go trims its build cache at five days unused, so
# clearing it here is a backstop, not the routine path.
#
# Module cache seeding. The runner image bakes a warm module cache, but the
# exports point Go at the node instead and would leave it unread, so the first
# job to see a node copies it across with cp -a on node disk, not a pull. The
# build cache is not baked, so that half of the loop finds nothing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Runner selection: see the header.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'github-runner-pgcopydb-operator' }}
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, LicenseRef-scancode-google-patent-license-golang
      # The cache volume: see the header.
      - name: Point the Go and lint caches at the shared volume
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/go-build /cache/go-mod /cache/golangci
          [ -O /cache/go-build ] || sudo chown "$(id -u):$(id -g)" \
            /cache /cache/go-build /cache/go-mod /cache/golangci
          avail=$(df -Pm /cache | awk 'NR == 2 {print $4}')
          if [ "${avail:-0}" -lt 20000 ]; then
            echo "Node disk down to ${avail}MB, cleared the build cache." >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf /cache/go-build /cache/go-mod /cache/golangci
            sudo mkdir -p /cache/go-build /cache/go-mod /cache/golangci
            sudo chown "$(id -u):$(id -g)" /cache/go-build /cache/go-mod /cache/golangci
          fi
          # Module cache seeding: see the header.
          for pair in "$(go env GOMODCACHE 2>/dev/null):/cache/go-mod" \
                      "$HOME/.cache/go-build:/cache/go-build"; do
            src=${pair%:*} dst=${pair#*:}
            [ -n "$src" ] && [ -d "$src" ] || continue
            [ -z "$(ls -A "$dst" 2>/dev/null)" ] || continue
            echo "Seeding $dst from the image's $src." >> "$GITHUB_STEP_SUMMARY"
            cp -a "$src/." "$dst/" 2>/dev/null || true
          done
          {
            echo "GOCACHE=/cache/go-build"
            echo "GOMODCACHE=/cache/go-mod"
            echo "GOLANGCI_LINT_CACHE=/cache/golangci"
          } >> "$GITHUB_ENV"
      # The runner image carries Helm. Only a fork's pull request, which lands
      # on a hosted runner, still needs this.
      - uses: azure/setup-helm@v5
        if: ${{ github.event.pull_request.head.repo.fork }}
      # The runner image carries these; a hosted runner, which is what a fork's
      # pull request gets, does not. The check makes this a no-op on ours.
      - name: Install what the runner lacks
        run: |
          if ! command -v pipx >/dev/null || ! command -v make >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pipx make
          fi
          # pipx installs into ~/.local/bin, which a hosted runner already has
          # on PATH and the stock actions-runner image does not. Appending a
          # path that is already there is harmless.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: yamllint
        # The runner image carries yamllint; a hosted runner, which is what a
        # fork's pull request gets, does not.
        run: |
          command -v yamllint >/dev/null || pipx install yamllint
          yamllint --strict .
      - name: actionlint
        run: |
          if ! command -v actionlint >/dev/null; then
            version=$(sed -n 's/^ARG ACTIONLINT_VERSION=//p' images/github-runner/Dockerfile)
            test -n "$version"
            GOBIN="$HOME/.local/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@$version"
          fi
          actionlint
      - name: Generated manifests are current
        run: >-
          make manifests &&
          changes=$(git status --porcelain --untracked-files=all -- config/crd/bases config/rbac) &&
          { test -z "$changes" || { printf '%s\n' "$changes"; exit 1; }; }
      - name: Chart CRD is current
        # The chart embeds controller-gen output; this fails on drift.
        run: ./hack/sync-chart-crd.sh --check
      - name: Chart RBAC is current
        # The chart's rules come from config/rbac; this fails on drift.
        run: ./hack/sync-chart-rbac.sh --check
      - name: helm lint
        run: helm lint charts/pgcopydb-operator
      - name: Chart RBAC renders as expected
        # helm lint renders the defaults only; this renders the combinations
        # that decide what the chart grants.
        run: ./hack/check-chart-rbac.sh
      - name: Chart monitoring renders as expected
        run: ./hack/check-chart-monitoring.sh
      - name: promtool checks and unit-tests the alert rules
        run: |
          ./hack/ensure-promtool.sh
          bin/promtool check rules charts/pgcopydb-operator/rules/migrations.yaml
          bin/promtool test rules test/alerts/migrations_test.yaml
      - name: golangci-lint
        run: make lint

  test:
    # Runner selection: see the header.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'github-runner-pgcopydb-operator' }}
    services:
      # The compare-data gate decides its verdict in SQL, and a server is the
      # only place that logic can be exercised. Without one TestCompareDataQuery
      # skips, and the check that exists to stop a blind pass ships unrun.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      # The cache volume: see the header.
      - name: Point the Go and lint caches at the shared volume
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/go-build /cache/go-mod /cache/golangci
          [ -O /cache/go-build ] || sudo chown "$(id -u):$(id -g)" \
            /cache /cache/go-build /cache/go-mod /cache/golangci
          avail=$(df -Pm /cache | awk 'NR == 2 {print $4}')
          if [ "${avail:-0}" -lt 20000 ]; then
            echo "Node disk down to ${avail}MB, cleared the build cache." >> "$GITHUB_STEP_SUMMARY"
            sudo rm -rf /cache/go-build /cache/go-mod /cache/golangci
            sudo mkdir -p /cache/go-build /cache/go-mod /cache/golangci
            sudo chown "$(id -u):$(id -g)" /cache/go-build /cache/go-mod /cache/golangci
          fi
          # Module cache seeding: see the header.
          for pair in "$(go env GOMODCACHE 2>/dev/null):/cache/go-mod" \
                      "$HOME/.cache/go-build:/cache/go-build"; do
            src=${pair%:*} dst=${pair#*:}
            [ -n "$src" ] && [ -d "$src" ] || continue
            [ -z "$(ls -A "$dst" 2>/dev/null)" ] || continue
            echo "Seeding $dst from the image's $src." >> "$GITHUB_STEP_SUMMARY"
            cp -a "$src/." "$dst/" 2>/dev/null || true
          done
          {
            echo "GOCACHE=/cache/go-build"
            echo "GOMODCACHE=/cache/go-mod"
            echo "GOLANGCI_LINT_CACHE=/cache/golangci"
          } >> "$GITHUB_ENV"
      # The runner image carries these; a hosted runner, which is what a fork's
      # pull request gets, does not. The check makes this a no-op on ours.
      # psql is the one this suite needs: TestCompareDataQuery fails, not skips,
      # when PGCOPYDB_TEST_PGURI is set and psql is missing.
      - name: Install make and psql, which the runner image lacks
        run: |
          if ! command -v make >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq make postgresql-client
          fi
      - name: Unit and envtest suites
        # make test downloads the envtest control-plane binaries itself.
        # The throwaway service above holds no data; the query only selects.
        env:
          PGCOPYDB_TEST_PGURI: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: make test
      - name: Cutover, publication-retry, and live-writer helper regressions (no cluster)
        env:
          PGCOPYDB_TEST_PGURI: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: go test ./test/e2e -run '^(TestCutoverDiagnostic|TestPublicationRetry|TestLiveWriter)' -count=1 -race -v
      - name: Coverage total
        run: go tool cover -func=cover.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
      # Codecov requires a token even for a public repo: a tokenless upload is
      # rejected with "Token required - not valid tokenless upload". Skipped
      # outright when no CODECOV_TOKEN secret is set, so the absence is visible
      # as a skipped step rather than a green job that uploaded nothing; when
      # the secret is set, a failed upload fails the job.
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out
          fail_ci_if_error: true

  docs:
    # Runner selection: see the header.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'github-runner-pgcopydb-operator' }}
    steps:
      - uses: actions/checkout@v7
      # The image carries python3 and mkdocs-material at the pin below.
      - uses: actions/setup-python@v7
        if: ${{ github.event.pull_request.head.repo.fork }}
        with:
          python-version: "3.x"
      - name: mkdocs build --strict
        # Pinned to match the docs deploy workflow; a Renovate custom manager
        # bumps both together.
        run: |
          # The runner image carries mkdocs-material at this pin, and a system
          # python refuses a system-wide install under PEP 668 anyway. Only a
          # fork's pull request, on a hosted runner with setup-python, installs.
          command -v mkdocs >/dev/null || pip install mkdocs-material==9.7.7
          mkdocs build --strict
