name: GitHub runner image

# The image both runner scale sets boot. Weekly, because the apt packages it
# installs move without anything in this repository changing. Everything else
# is pinned, so it moves through a Renovate pull request: merging one rebuilds
# the image, because the paths filter below watches the Dockerfile. Go and
# promtool come from go.mod and hack/ensure-promtool.sh, which the same filter
# watches, so the image follows the versions the Makefile actually uses.
#
# Only this repository can reach the runners it builds for, so the schedule is
# harmless on a fork: the job would build an image nothing runs.

on:
  schedule:
    # Monday 04:00 UTC, before auto-release.yml cuts the weekly candidate, so a
    # release is gated by the same image the week's CI ran on.
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-runner-image.yml"
      - "images/github-runner/Dockerfile"
      - "images/github-runner/Dockerfile.dockerignore"
      - "images/github-runner/verify.sh"
      # The Go and promtool versions are read out of these at build time.
      - "go.mod"
      - "hack/ensure-promtool.sh"

# A half-pushed image is worse than a queued second run, matching
# pgcopydb-builder.yml. It also keeps two buildah runs off one node's storage.
concurrency:
  group: github-runner-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/github-runner

jobs:
  build:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v7

      # The dind sidecar, like every other image this repository builds. buildah
      # was tried first, to keep the build off a privileged daemon, and cannot
      # work here: the runner pod runs under cri-containerd.apparmor.d, which
      # denies mount as an LSM rule, so extracting a base layer fails for root
      # and inside a user namespace alike. Capabilities do not override that.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        # A date tag so a bad week can be rolled back to a named image, and
        # :latest because that is the tag the scale sets track.
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          # The repository root, not images/github-runner: the build reads
          # go.mod, hack/ensure-promtool.sh and the source tree for the
          # versions it pins and the caches it warms.
          context: .
          file: images/github-runner/Dockerfile
          # amd64 only. Both scale sets run on this cluster's nodes and every
          # one of them is amd64; an arm64 variant would be built under QEMU
          # for nothing to pull it.
          platforms: linux/amd64
          # Loaded, not pushed, so the check below runs against the image
          # before anything can boot it.
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/github-runner:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}/github-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image carries what the jobs reach for
        # An image missing a tool turns every workflow red at once, and the
        # scale sets boot the tag without asking. The script arrives on stdin
        # rather than a bind mount: the daemon is a sidecar, so it cannot see
        # this container's workspace.
        run: |
          {
            echo "### Runner image \`$IMAGE:${{ steps.meta.outputs.date }}\`"
            echo
            docker run --rm -i "$IMAGE:${{ steps.meta.outputs.date }}" \
              bash -s < images/github-runner/verify.sh
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        run: |
          for tag in "${{ steps.meta.outputs.date }}" latest; do
            docker push "$IMAGE:$tag"
          done
