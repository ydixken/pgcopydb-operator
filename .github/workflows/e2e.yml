name: E2E

# Runs the e2e suite against an already published release.
#
# Automatically on a stable tag, because promote rebuilds rather than retags:
# the images a stable release ships are not the ones e2e checked on the
# candidate. This run checks what users actually pull, and its result is what
# the E2E badge reports: the badge carries ?event=push, because a tag run is
# recorded against the tag and an unscoped badge only ever reads main.
#
# release.yml runs e2e once, against the candidate it just built. That answers
# "is this candidate good" but cannot answer "which release did this start
# failing in", because the suite, the chart and the images all move together
# with the tag. This workflow holds the suite and the chart at the checked out
# ref and varies only the images, so two runs differing by one tag isolate the
# image as the cause.
#
# Nothing a fork can trigger may reach a runner that can talk to the cluster:
# a tag push and workflow_dispatch both require write access.

on:
  push:
    # Stable tags only. A candidate is already covered by release.yml, and
    # running both would queue a second job against a single-tenant suite for
    # no new information.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to install, for example v0.11.3
        required: false
        type: string
      scale:
        description: E2E_SCALE, the fixture size multiplier
        required: false
        default: "0.1"
        type: string

permissions:
  contents: read

concurrency:
  # The suite is single tenant on a shared cluster: two runs destroy each
  # other's fixtures. Queue rather than cancel, so a run already touching the
  # cluster is allowed to finish and clean up after itself.
  group: e2e-cluster
  cancel-in-progress: false

jobs:
  e2e:
    # environment is the security control, matching release.yml: its deployment
    # policy admits only main and v*, and that is evaluated before any runner
    # is assigned. The repository check below is belt and braces.
    if: github.repository == 'ydixken/pgcopydb-operator'
    runs-on: github-runner-pgcopydb-e2e
    environment: e2e-cluster
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v7
      # The scale set runs a bare actions-runner image: git and node are all it
      # ships, so every tool the suite shells out to is installed here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5
      - name: Wait for the release images to be published
        # A tag push starts this workflow and release.yml at the same time, and
        # release.yml still has to build and push the images this run installs.
        # Poll the registry rather than guess a sleep.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for image in pgcopydb-operator pgcopydb-operator/runner; do
            for i in $(seq 1 60); do
              # sed, not jq: the runner image ships git and node and little else.
              token=$(curl -fsS "https://ghcr.io/token?scope=repository:ydixken/$image:pull" \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ydixken/$image/manifests/$TAG")
              [ "$code" = "200" ] && { echo "$image:$TAG published"; break; }
              [ "$i" = "60" ] && { echo "::error::$image:$TAG never appeared"; exit 1; }
              sleep 30
            done
          done
      - name: Require the Prometheus URL
        # The metrics specs Skip when no Prometheus knob is set; a missing
        # repository variable must fail loudly rather than shrink the suite.
        env:
          E2E_PROMETHEUS_URL: ${{ vars.E2E_PROMETHEUS_URL }}
        run: test -n "$E2E_PROMETHEUS_URL"
      - name: Run the suite against ${{ inputs.tag || github.ref_name }}
        # -v and -ginkgo.v stream the output; without them go test buffers the
        # whole package and a run that hits the timeout prints nothing at all.
        # poll-progress-after is 15m because a clone at the default scale runs
        # for minutes on end: at 5m it fired on every healthy spec.
        env:
          # A tag push has no inputs, so fall back to the tag that triggered it.
          E2E_OPERATOR_TAG: ${{ inputs.tag || github.ref_name }}
          E2E_SCALE: ${{ inputs.scale || '0.1' }}
          E2E_MANAGE_NAMESPACES: "false"
          E2E_STORAGE_CLASS: ${{ vars.E2E_STORAGE_CLASS }}
          E2E_PROMETHEUS_URL: ${{ vars.E2E_PROMETHEUS_URL }}
        run: |
          go test ./test/e2e/... -v -timeout 4h \
            -ginkgo.v -ginkgo.timeout=4h -ginkgo.poll-progress-after=15m \
            -ginkgo.label-filter='!chaos && !flaky'
      - name: Empty the e2e namespaces
        # The namespaces are GitOps owned and the CI identity cannot delete
        # them, so clean the contents. Migrations first, while the operator
        # that owns their cleanup finalizer is still installed.
        if: always()
        run: |
          for ns in pgcopydb-e2e pgcopydb-e2e-x; do
            kubectl delete migrations.pgcopydb-operator.io --all -n "$ns" --ignore-not-found --timeout=5m
          done
          helm uninstall pgcopydb-e2e -n pgcopydb-e2e-system --ignore-not-found --wait || true
          for ns in pgcopydb-e2e pgcopydb-e2e-x pgcopydb-e2e-system; do
            kubectl delete clusters.postgresql.cnpg.io,jobs,pvc --all -n "$ns" --ignore-not-found --timeout=5m
          done
