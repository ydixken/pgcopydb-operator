name: Release

# Publishes the public artifacts to ghcr.io on version tags:
# manager image, runner image, and the Helm chart as OCI.
# Images are multi-arch (linux/amd64 + linux/arm64) via buildx (M4). The manager
# cross-compiles both from one native toolchain; only the runner needs QEMU,
# for its apt install and version canary, both of which still run emulated on
# arm64. pgcopydb itself is no longer compiled here; images/pgcopydb-builder
# builds it and this workflow only copies the result in.
#
# A tag carrying an -rc.N suffix publishes the same artifacts, then runs e2e
# against them on the cluster and pushes the stable tag when that passes. So
# the workflow runs twice per release, once for the candidate and once for
# what it promoted, and only the second run moves `latest`.
#
# The two image jobs run on the cluster's own runner scale set
# (github-runner-pgcopydb-operator, an Actions Runner Controller install
# managed from the app-of-apps repo). On the runner image itself the emulated
# arm64 half is only an apt install and a version canary, where core count
# buys almost nothing; the win is the pgcopydb builder compile that the same
# job also runs, on the rare release where its tag is missing, where the
# cluster nodes' 20 cores against a GitHub-hosted runner's 2 matter under
# QEMU. That makes releases depend on the cluster being reachable; if it is
# down the jobs queue rather than fail. The chart job stays hosted because
# helm packaging gains nothing from the move.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  manager-image:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v7
      # No setup-qemu here: the builder stage pins --platform=$BUILDPLATFORM and
      # the distroless final stage is COPY-only, so nothing is ever emulated.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether this tag also moves :latest
        id: tags
        # A release candidate publishes under its own tag only: `latest` has
        # to keep pointing at the last stable image until e2e promotes one.
        # Same test release-notes makes for --prerelease, a hyphen is SemVer
        # for "prerelease".
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *) echo "$IMAGE:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The buildx layer cache goes on the node, next to the Go caches,
      # rather than through GitHub's cache service. One directory per image,
      # so rebuilding one cannot evict another's layers.
      - id: cachemgr
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/buildx-manager
          [ -O /cache/buildx-manager ] || sudo chown "$(id -u):$(id -g)" /cache/buildx-manager
          echo "dir=/cache/buildx-manager" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # The manager stamps VERSION into pgcopydb_operator_build_info;
          # without it a released image reports "dev".
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: ${{ steps.cachemgr.outputs.dir && format('type=local,src={0}', steps.cachemgr.outputs.dir) || '' }}
          cache-to: ${{ steps.cachemgr.outputs.dir && format('type=local,dest={0},mode=max', steps.cachemgr.outputs.dir) || '' }}

  runner-image:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The pgcopydb compile is ~20 minutes under QEMU and its only input is
      # PGCOPYDB_SHA, which changed once across 55 tags. Build when the tag is
      # missing, reuse it every other time.
      - name: Read the pinned pgcopydb commit
        id: pin
        run: |
          sha=$(sed -n 's/^ARG PGCOPYDB_SHA=//p' images/pgcopydb-builder/Dockerfile)
          if [ -z "$sha" ]; then
            echo "::error::images/pgcopydb-builder/Dockerfile has no ARG PGCOPYDB_SHA=<value>"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Is the pgcopydb builder image already published?
        id: builder
        # imagetools reuses the docker login above, so it works while the
        # package is private. "Cannot tell" is an error, not a miss: treating
        # a registry blip as absence would overwrite a tag mid-pull.
        run: |
          ref="$IMAGE/pgcopydb-builder:${{ steps.pin.outputs.sha }}"
          set +e
          out=$(docker buildx imagetools inspect "$ref" 2>&1); rc=$?
          set -e
          # $ref embeds the 40-char SHA, which can itself contain "404"; strip
          # it before matching or that coincidence reads a transient failure
          # as absence and republishes the tag over content mid-pull.
          msg=$(printf '%s' "$out" | sed "s#$ref##g")
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$msg" | grep -qiE 'not found|MANIFEST_UNKNOWN|404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot reach $ref: $out"
            exit 1
          fi
      - name: Build the pgcopydb builder image
        if: steps.builder.outputs.exists != 'true'
      # The buildx layer cache goes on the node, next to the Go caches,
      # rather than through GitHub's cache service. One directory per image,
      # so rebuilding one cannot evict another's layers.
      - id: cachebld
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/buildx-pgcopydb-builder
          [ -O /cache/buildx-pgcopydb-builder ] || sudo chown "$(id -u):$(id -g)" /cache/buildx-pgcopydb-builder
          echo "dir=/cache/buildx-pgcopydb-builder" >> "$GITHUB_OUTPUT"
        uses: docker/build-push-action@v7
        with:
          context: images/pgcopydb-builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}/pgcopydb-builder:${{ steps.pin.outputs.sha }}
          cache-from: ${{ steps.cachebld.outputs.dir && format('type=local,src={0}', steps.cachebld.outputs.dir) || '' }}
          cache-to: ${{ steps.cachebld.outputs.dir && format('type=local,dest={0},mode=max', steps.cachebld.outputs.dir) || '' }}
      - name: Decide whether this tag also moves :latest
        id: tags
        # See manager-image: an rc must not move the tag a `helm install`
        # without an explicit version lands on.
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE/runner:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *) echo "$IMAGE/runner:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The buildx layer cache goes on the node, next to the Go caches,
      # rather than through GitHub's cache service. One directory per image,
      # so rebuilding one cannot evict another's layers.
      - id: cacherun
        run: |
          [ -d /cache ] || exit 0
          sudo mkdir -p /cache/buildx-runner
          [ -O /cache/buildx-runner ] || sudo chown "$(id -u):$(id -g)" /cache/buildx-runner
          echo "dir=/cache/buildx-runner" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: ${{ steps.cacherun.outputs.dir && format('type=local,src={0}', steps.cacherun.outputs.dir) || '' }}
          cache-to: ${{ steps.cacherun.outputs.dir && format('type=local,dest={0},mode=max', steps.cacherun.outputs.dir) || '' }}
      - name: Smoke-test pgcopydb and pg_dump versions
        # The build canary already asserts versions on both platforms; this
        # proves the pushed image actually runs and carries the fork-built
        # pgcopydb (see images/runner/Dockerfile). Native amd64 pull on the
        # amd64 runner; the arm64 half was validated by spike S6 (podman).
        run: |
          docker run --rm "$IMAGE/runner:$GITHUB_REF_NAME" pgcopydb --version | grep -F '0.18.5.ge37d2bd'
          docker run --rm "$IMAGE/runner:$GITHUB_REF_NAME" pg_dump --version

  chart:
    runs-on: github-runner-pgcopydb-operator
    needs: [manager-image, runner-image]
    steps:
      - uses: actions/checkout@v7
        with:
          # hack/stamp-chart.sh reads the tag history to build the changelog.
          fetch-depth: 0
      - name: Push chart as OCI
        # Chart version and appVersion both track the git tag (without the
        # leading v, Helm requires SemVer). stamp-chart.sh fills in the
        # Artifact Hub annotations that only make sense per release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint charts/pgcopydb-operator
          ./hack/stamp-chart.sh "$GITHUB_REF_NAME"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm package charts/pgcopydb-operator --version "$VERSION" --app-version "$GITHUB_REF_NAME"
          helm push "pgcopydb-operator-$VERSION.tgz" "oci://$IMAGE/charts"

  release-notes:
    # Last, so a release only appears once its artifacts are actually published.
    runs-on: github-runner-pgcopydb-operator
    needs: [chart]
    permissions:
      contents: write  # the workflow default is read-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every tag with a hyphen is a SemVer prerelease; marking it keeps
          # GitHub's "Latest release" pointing at a stable tag once one exists.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease

  e2e:
    # Release candidates only. A stable tag reaches this workflow because the
    # promote job below pushed it, which only happens once this job passed on
    # the candidate that built the very same images.
    #
    # `environment` is the security control: its deployment branch and tag
    # policy allows main and v* only, and GitHub evaluates that before the job
    # is dispatched to a runner. A fork pull request runs at refs/pull/N/merge,
    # which matches neither, so it never reaches a machine that can talk to the
    # cluster. The repository and fork checks below are belt and braces, not
    # the control: a fork owns its copy of this file and can delete them. They
    # earn their place because what GitHub documents for a rejected ref is only
    # that "the job will fail and the run will stop", not that it fails before
    # a self-hosted runner is assigned.
    if: >-
      contains(github.ref_name, '-rc.')
      && github.repository == 'ydixken/pgcopydb-operator'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [chart]
    runs-on: github-runner-pgcopydb-e2e
    environment: e2e-cluster
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v7
      # The scale set runs a bare actions-runner image: git and node are all
      # it ships, so every tool the suite shells out to is installed here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require the Prometheus URL
        # The metrics specs Skip when no Prometheus knob is set. On this gate
        # a missing repository variable must fail loudly, or the release would
        # go green without ever proving a single exported series.
        env:
          E2E_PROMETHEUS_URL: ${{ vars.E2E_PROMETHEUS_URL }}
        run: test -n "$E2E_PROMETHEUS_URL"
      - name: Run the suite against the published candidate
        # Not `task e2e`: that target prompts for confirmation because it can
        # point at any cluster, and AGENTS.md forbids answering the prompt with
        # `task --yes`. This runner has exactly one cluster and no prompt to
        # answer, so it calls go test with the same flags the task passes.
        env:
          E2E_OPERATOR_TAG: ${{ github.ref_name }}
          E2E_SCALE: "0.1"
          E2E_MANAGE_NAMESPACES: "false"
          E2E_STORAGE_CLASS: ${{ vars.E2E_STORAGE_CLASS }}
          E2E_PROMETHEUS_URL: ${{ vars.E2E_PROMETHEUS_URL }}
        # -v and -ginkgo.v are what make this readable while it runs. Without
        # -v, go test buffers the whole package and prints nothing until it
        # exits, so a long run looks hung and a run that hits the job timeout
        # produces no output at all. poll-progress-after turns a spec that
        # wedges into a stack dump rather than silence.
        #
        # 15m, not 5m. A healthy clone spec at the CI scale runs for minutes on
        # end, so a five minute threshold fired on every one of them and the
        # dump stopped meaning anything. A diagnostic that triggers on normal
        # work is one nobody reads, which is worse than not having it.
        run: |
          go test ./test/e2e/... -v -timeout 4h \
            -ginkgo.v -ginkgo.timeout=4h -ginkgo.poll-progress-after=15m \
            -ginkgo.label-filter='!chaos && !flaky'
      - name: Empty the e2e namespaces
        # AfterSuite already does this when the suite exits cleanly; this is
        # for the run that crashed or hit the timeout. The namespaces
        # themselves stay: GitOps owns them, and the CI identity has no
        # permission to delete a namespace anyway.
        if: always()
        run: |
          # Migrations first, while the operator that owns their cleanup
          # finalizer is still installed. Uninstalling ahead of them wedges
          # the delete until the finalizer is forced off by hand.
          for ns in pgcopydb-e2e pgcopydb-e2e-x; do
            kubectl delete migrations.pgcopydb-operator.io --all -n "$ns" --ignore-not-found --timeout=5m
          done
          helm uninstall pgcopydb-e2e -n pgcopydb-e2e-system --ignore-not-found --wait
          for ns in pgcopydb-e2e pgcopydb-e2e-x pgcopydb-e2e-system; do
            kubectl delete clusters.postgresql.cnpg.io,jobs,pvc --all -n "$ns" --ignore-not-found --timeout=5m
          done

  promote:
    # Turning v0.4.1-rc.2 into v0.4.1 pushes a new tag and lets that tag run
    # this whole workflow again; nothing is rebuilt here. The two runs are not
    # byte-identical: the manager bakes GITHUB_REF_NAME into its binary via
    # ldflags, and the chart's version and appVersion track it too, so both
    # differ between the candidate and the stable release by construction.
    # The runner's apt layers float on purpose, so a security update can land
    # on the stable image even though the candidate predates it. What does
    # hold still is the runner's pgcopydb layer: both runs copy it from the
    # same pgcopydb-builder tag, keyed by the pinned commit rather than by
    # GITHUB_REF_NAME.
    #
    # The recursion stops one level down. The tag pushed here has no -rc., so
    # in that run the e2e job's `if` skips, and promote skips with it.
    needs: [e2e, release-notes]
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags come with the full history only, and the check below has to
          # see an existing stable tag rather than tag over it.
          fetch-depth: 0
          # Pushing under the deploy key is what makes this tag start another
          # release run; see the same note in auto-release.yml. The key also
          # carries the write, which is why this job needs no contents: write.
          ssh-key: ${{ secrets.RELEASE_TAG_KEY }}
      - name: Push the stable tag
        run: |
          stable="${GITHUB_REF_NAME%-rc.*}"
          if git rev-parse -q --verify "refs/tags/$stable" >/dev/null; then
            echo "$stable already exists, nothing to promote." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$stable" -m "$stable: promoted from $GITHUB_REF_NAME"
          git push origin "$stable"
          echo "Promoted $GITHUB_REF_NAME to $stable." >> "$GITHUB_STEP_SUMMARY"

  e2e-failed:
    # A failed candidate is otherwise silent: its artifacts stay published, the
    # GitHub release stays a prerelease, `latest` never moved, and the next
    # Monday would just cut -rc.N+1 over the same bug. The issue is the signal.
    needs: [e2e]
    # failure() is what gets this job evaluated at all once a dependency went
    # red; the result check keeps it to an e2e failure, rather than firing on
    # a chart job that failed before e2e ever ran.
    if: failure() && needs.e2e.result == 'failure'
    runs-on: github-runner-pgcopydb-operator
    permissions:
      issues: write  # the workflow default is read-only
    steps:
      - name: Open an issue against the candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout here, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "e2e failed for $GITHUB_REF_NAME" --body-file - <<EOF
          The candidate \`$GITHUB_REF_NAME\` did not pass e2e and was not promoted.

          Run: $RUN_URL

          Its images and chart are published, the GitHub release stays marked as
          a prerelease, and the \`latest\` tags still point at the last stable
          release. Fix forward on main: the next run cuts the following
          candidate.
          EOF
