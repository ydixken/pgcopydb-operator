name: Release

# Publishes the public artifacts to ghcr.io on version tags:
# manager image, runner image, and the Helm chart as OCI.
# Images are multi-arch (linux/amd64 + linux/arm64) via QEMU/buildx (M4).
#
# The two image jobs run on the cluster's own runner scale set
# (github-runner-pgcopydb-operator, an Actions Runner Controller install
# managed from the app-of-apps repo). The arm64 half is QEMU-emulated on
# either runner, so the win is core count: the cluster nodes have 20 against
# a GitHub-hosted runner's 2. That makes releases depend on the cluster being
# reachable; if it is down the jobs queue rather than fail. The chart job
# stays hosted because helm packaging gains nothing from the move.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  manager-image:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  runner-image:
    runs-on: github-runner-pgcopydb-operator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}/runner:${{ github.ref_name }}
            ${{ env.IMAGE }}/runner:latest
      - name: Smoke-test pgcopydb and pg_dump versions
        # The build canary already asserts majors on both platforms; this
        # proves the pushed image actually runs. Native amd64 pull on the
        # amd64 runner; the arm64 half was validated by spike S6 (podman).
        run: |
          docker run --rm "$IMAGE/runner:$GITHUB_REF_NAME" pgcopydb --version
          docker run --rm "$IMAGE/runner:$GITHUB_REF_NAME" pg_dump --version

  chart:
    runs-on: ubuntu-latest
    needs: [manager-image, runner-image]
    steps:
      - uses: actions/checkout@v5
        with:
          # hack/stamp-chart.sh reads the tag history to build the changelog.
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - name: Push chart as OCI
        # Chart version and appVersion both track the git tag (without the
        # leading v, Helm requires SemVer). stamp-chart.sh fills in the
        # Artifact Hub annotations that only make sense per release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint charts/pgcopydb-operator
          ./hack/stamp-chart.sh "$GITHUB_REF_NAME"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm package charts/pgcopydb-operator --version "$VERSION" --app-version "$GITHUB_REF_NAME"
          helm push "pgcopydb-operator-$VERSION.tgz" "oci://$IMAGE/charts"

  release-notes:
    # Last, so a release only appears once its artifacts are actually published.
    runs-on: ubuntu-latest
    needs: [chart]
    permissions:
      contents: write  # the workflow default is read-only
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every tag with a hyphen is a SemVer prerelease; marking it keeps
          # GitHub's "Latest release" pointing at a stable tag once one exists.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
