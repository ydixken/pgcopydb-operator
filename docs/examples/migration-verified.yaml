# Clone with post-migration verification. After the copy succeeds the operator
# runs one Job per enabled check (pgcopydb compare schema, then compare data)
# and reports the result in the Verified condition and the
# pgcopydb_migration_verified metric (1 pass, 0 mismatch). A mismatch never
# rolls anything back: Complete stays true, the condition, a warning event,
# and the compare Job logs carry the finding.
#
# Both checks are opt-in. schema compares what pgcopydb models (tables,
# columns, indexes, constraints, sequence values), not functions, triggers, or
# ACLs. data checksums every table row on both sides; on large databases that
# is two full sequential scans, so enable it deliberately.
#
# Follow mode: verification runs after cutover has drained and replication
# state is cleaned up. Keep applications off the target until Verified
# reports; writes landing on either side during the compare show up as
# mismatches.
apiVersion: pgcopydb-operator.io/v1alpha1
kind: Migration
metadata:
  name: verified-clone
spec:
  source:
    host: legacy-db.example.com
    database: app
    username: migrator
    passwordSecretRef: {name: legacy-db-migrator, key: password}
  target:
    host: app-pg-rw.app.svc
    database: app
    username: app
    passwordSecretRef: {name: app-pg-app, key: password}
  verification:
    schema: true
    data: true  # full-table checksums; expensive on big databases
