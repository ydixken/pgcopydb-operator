# Migrating from a DBaaS (RDS, Neon, ...): the provider gives a full
# connection URI; store it in a Secret and reference it. TLS verification
# against a provider CA bundle is shown on the target side.
apiVersion: pgcopydb-operator.io/v1alpha1
kind: Migration
metadata:
  name: from-dbaas
spec:
  source:
    # Secret key holds the complete libpq URI including credentials, e.g.
    # postgres://user:pass@db.abc.eu-central-1.rds.amazonaws.com/app?sslmode=require
    uriSecretRef: {name: rds-source, key: uri}
  target:
    host: app-pg-rw.app.svc
    database: app
    username: app
    passwordSecretRef: {name: app-pg-app, key: password}
    sslMode: verify-full
    tls:
      rootCA: {name: app-pg-ca, key: ca.crt}
