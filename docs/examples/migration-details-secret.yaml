# Platform-provisioned databases often come with one credentials Secret
# holding the connection parts as individual keys (DB, PW, URL,
# URL_EXTERNAL, USER). secretRef consumes such a Secret directly; keys
# remaps deviating key names.
apiVersion: pgcopydb-operator.io/v1beta1
kind: Migration
metadata:
  name: from-platform
spec:
  source:
    # The Secret carries the convention keys, DB holding a password-free
    # URI such as postgresql://svc@db.example.com:5432/app. The URI
    # supplies user, host, port, and database name; PW the password.
    secretRef:
      name: clouddb-app
  target:
    # This Secret names its keys differently, and its bare database name
    # means the host comes from a URL key; endpoint: external picks the
    # externally reachable one.
    secretRef:
      name: platform-db
      endpoint: external
      keys:
        database: db
        password: pw
        urlExternal: host
        username: role
    sslMode: require
