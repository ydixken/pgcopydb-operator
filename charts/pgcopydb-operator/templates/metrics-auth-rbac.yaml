{{- if and .Values.rbac.create .Values.metrics.enabled }}
{{- /* The secure metrics endpoint authenticates its scrapers itself, turning
each caller's token into a TokenReview and its access into a
SubjectAccessReview. Rules mirror config/rbac/metrics_auth_role.yaml. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "pgcopydb-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
