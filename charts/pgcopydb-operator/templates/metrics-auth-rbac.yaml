{{- if and .Values.rbac.create .Values.metrics.enabled }}
{{- /* Generated by hack/sync-chart-rbac.sh from config/rbac/metrics_auth_role.yaml.
The secure metrics endpoint authenticates its scrapers itself: it sends
each caller's token to the API server as a TokenReview and its access as
a SubjectAccessReview. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pgcopydb-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "pgcopydb-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
