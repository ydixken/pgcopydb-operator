{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: https-metrics
      scheme: https
      honorLabels: false
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      # The endpoint authenticates every scrape, so a scrape carrying no
      # credential is rejected with 401 before authorization is ever reached.
      # Prometheus attaches nothing on its own, so point it at its own
      # ServiceAccount token.
      #
      # bearerTokenFile is deprecated upstream in favour of authorization,
      # but authorization takes only a Secret reference and has no file form,
      # so it cannot read a projected ServiceAccount token. kube-prometheus
      # -stack's own ServiceMonitors still use bearerTokenFile for the same
      # reason. Move to authorization once it grows a credentialsFile.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The manager serves metrics with a self-signed certificate.
        insecureSkipVerify: true
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  selector:
    matchLabels:
      {{- include "pgcopydb-operator.selectorLabels" . | nindent 6 }}
{{- end }}
