apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgcopydb-operator.fullname" . }}
  labels:
    {{- include "pgcopydb-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pgcopydb-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pgcopydb-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pgcopydb-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          command:
            - /manager
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --runner-image={{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag | default .Chart.AppVersion }}
            - --progress-poll-versions={{ join "," .Values.runner.progressPollVersions }}
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --health-probe-bind-address=:8081
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.otel.enabled .Values.extraEnv }}
          env:
            {{- if .Values.otel.enabled }}
            {{- $otel := .Values.otel }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "otel.endpoint is required when otel.enabled is true" $otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $otel.protocol | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ ternary "otlp" "none" $otel.signals.metrics | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ mul $otel.metricsIntervalSeconds 1000 | quote }}
            {{- with $otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ . | quote }}
            {{- end }}
            {{- if $otel.tls.insecure }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            {{- end }}
            {{- if $otel.tls.caSecret.name }}
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/otel/ca/{{ $otel.tls.caSecret.key }}
            {{- end }}
            {{- if $otel.tls.clientCertSecret.name }}
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: /etc/otel/client/tls.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: /etc/otel/client/tls.key
            {{- end }}
            {{- if $otel.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ $otel.headersSecret.name }}
                  key: {{ $otel.headersSecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - containerPort: 8443
              name: https-metrics
              protocol: TCP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if and .Values.otel.enabled (or .Values.otel.tls.caSecret.name .Values.otel.tls.clientCertSecret.name) }}
          volumeMounts:
            {{- if .Values.otel.tls.caSecret.name }}
            - name: otel-ca
              mountPath: /etc/otel/ca
              readOnly: true
            {{- end }}
            {{- if .Values.otel.tls.clientCertSecret.name }}
            - name: otel-client
              mountPath: /etc/otel/client
              readOnly: true
            {{- end }}
          {{- end }}
      terminationGracePeriodSeconds: 10
      {{- if and .Values.otel.enabled (or .Values.otel.tls.caSecret.name .Values.otel.tls.clientCertSecret.name) }}
      volumes:
        {{- if .Values.otel.tls.caSecret.name }}
        - name: otel-ca
          secret:
            secretName: {{ .Values.otel.tls.caSecret.name }}
        {{- end }}
        {{- if .Values.otel.tls.clientCertSecret.name }}
        - name: otel-client
          secret:
            secretName: {{ .Values.otel.tls.clientCertSecret.name }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
