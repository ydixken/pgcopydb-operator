apiVersion: v2
name: pgcopydb-operator
description: Kubernetes operator that migrates PostgreSQL databases with pgcopydb.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/ydixken/pgcopydb-operator
sources:
  - https://github.com/ydixken/pgcopydb-operator
keywords:
  - postgresql
  - migration
  - pgcopydb
  - operator
maintainers:
  - name: Yannick Dixken
    email: ydixken@googlemail.com
annotations:
  # Chart.yaml has no first-class license field; Artifact Hub reads this one.
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Migration
      version: v1beta1
      name: migrations.pgcopydb-operator.io
      displayName: Migration
      description: "One PostgreSQL migration: bulk clone, optional logical-replication follow, controlled cutover."
  artifacthub.io/links: |
    - name: Quickstart
      url: https://github.com/ydixken/pgcopydb-operator/blob/main/docs/quickstart.md
    - name: Prerequisites
      url: https://github.com/ydixken/pgcopydb-operator/blob/main/docs/reference/prerequisites.md
