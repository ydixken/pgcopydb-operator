# Default values for the pgcopydb-operator chart.

image:
  repository: ghcr.io/ydixken/pgcopydb-operator
  # Empty tag falls back to the chart appVersion, so chart and image move together.
  tag: ""
  pullPolicy: IfNotPresent

# Image the manager spawns as per-Migration worker Jobs (passed as --runner-image).
runner:
  image:
    repository: ghcr.io/ydixken/pgcopydb-operator/runner
    # Empty tag falls back to the chart appVersion.
    tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Empty name derives from the release fullname.
  name: ""

rbac:
  create: true

# Namespaces the manager watches and reconciles; empty means cluster-wide.
# RBAC stays cluster-scoped either way (the chart renders a ClusterRole);
# only the informer cache narrows.
watchNamespaces: []

# One replica is enough: leader election makes extra replicas hot standbys only.
replicaCount: 1

leaderElection:
  enabled: true

crds:
  # CRDs render as regular templates so helm upgrade updates them.
  install: true
  # keep annotates the CRD with helm.sh/resource-policy: keep so uninstall never
  # deletes it (and with it every Migration CR). false drops the annotation.
  keep: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # No cpu limit by design: throttling a controller only adds reconcile latency.
  limits:
    memory: 256Mi

metrics:
  # Serves HTTPS metrics on :8443; disabling passes --metrics-bind-address=0.
  enabled: true
  serviceMonitor:
    # Needs the Prometheus Operator CRDs; the template also skips itself when
    # monitoring.coreos.com/v1 is absent from the cluster.
    enabled: false

networkPolicy:
  # Placeholder for the M2 sentinel-port policy; renders nothing yet.
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
