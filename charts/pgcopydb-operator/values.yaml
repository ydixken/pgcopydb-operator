# Default values for the pgcopydb-operator chart.

image:
  repository: ghcr.io/ydixken/pgcopydb-operator
  # Empty tag falls back to the chart appVersion, so chart and image move together.
  tag: ""
  pullPolicy: IfNotPresent

# Image the manager spawns as per-Migration worker Jobs (passed as --runner-image).
runner:
  image:
    repository: ghcr.io/ydixken/pgcopydb-operator/runner
    # Empty tag falls back to the chart appVersion.
    tag: ""
  # Exact pgcopydb versions allowed to run the in-pod progress poll. Fail
  # closed: any other runner version never runs it, an empty list disables it.
  progressPollVersions:
    - "0.18.39.g93eda1d"
    - "0.18.36.g972e221"
    - "0.18.34.g7fddd6f"
    - "0.18.22.g22e29c3"
    - "0.18.15.gea2dc96"
    - "0.18.13.g4873c18"
    - "0.18.10.gaadc4bf"
    - "0.18.5.ge37d2bd"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Empty name derives from the release fullname.
  name: ""

rbac:
  create: true

# Namespaces the manager watches and reconciles; empty means cluster-wide.
# RBAC stays cluster-scoped either way (the chart renders a ClusterRole);
# only the informer cache narrows.
watchNamespaces: []

# One replica is enough: leader election makes extra replicas hot standbys only.
replicaCount: 1

leaderElection:
  enabled: true

crds:
  # CRDs render as regular templates so helm upgrade updates them.
  install: true
  # keep annotates the CRD with helm.sh/resource-policy: keep so uninstall never
  # deletes it (and with it every Migration CR). false drops the annotation.
  keep: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # No cpu limit by design: throttling a controller only adds reconcile latency.
  limits:
    memory: 256Mi

metrics:
  # Serves HTTPS metrics on :8443; disabling passes --metrics-bind-address=0.
  # The endpoint authenticates its scrapers, so this also grants the operator
  # create on tokenreviews and subjectaccessreviews. A scraper needs get on
  # the /metrics nonResourceURL to get past it.
  enabled: true
  serviceMonitor:
    # Needs the Prometheus Operator CRDs; the template also skips itself when
    # monitoring.coreos.com/v1 is absent from the cluster.
    enabled: false
    # Extra metadata labels, for a Prometheus that selects monitors by label.
    additionalLabels: {}
    # The operator samples database sizes every 5s while a copy runs, so a
    # slower scrape throws away samples that already exist. Timeout stays empty
    # on purpose: Prometheus clamps an inherited global timeout down to the
    # interval, so it cannot exceed it here.
    interval: "5s"
    scrapeTimeout: ""
    # Verbatim ServiceMonitor syntax: relabelings rewrite the target before
    # the scrape, metricRelabelings rewrite samples before ingestion.
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    # Ship the bundled alert rules (rules/migrations.yaml) as a
    # PrometheusRule; also needs the Prometheus Operator CRDs.
    enabled: false
    # Extra metadata labels, for a Prometheus that selects rules by label
    # (kube-prometheus-stack does).
    additionalLabels: {}

grafana:
  dashboards:
    # Ship the Grafana dashboards in dashboards/ as ConfigMaps labeled
    # grafana_dashboard: "1" for the sidecar to pick up.
    enabled: false
    # Namespace for the ConfigMaps; empty uses the release namespace. The
    # sidecar usually watches only Grafana's own namespace, so point it there.
    namespace: ""
    # Grafana folder, via the grafana_folder annotation; needs the sidecar's
    # folderAnnotation setting. Empty skips the annotation.
    folder: "pgcopydb"
    additionalLabels: {}
    additionalAnnotations: {}

networkPolicy:
  # Reserved for a NetworkPolicy around the manager. The chart ships no policy
  # template, so enabling this renders nothing: the exec-based sentinel control
  # plane opens no inbound port, leaving nothing to restrict.
  enabled: false

# OpenTelemetry export over OTLP. Off by default; Prometheus scraping is
# unaffected either way. See docs/operations/opentelemetry.md.
otel:
  enabled: false
  # Required when enabled. grpc: http://otel-collector.observability:4317 for a
  # plaintext collector, https:// for TLS. A host:port without a scheme uses TLS
  # unless tls.insecure is true. http/protobuf: http://otel-collector.observability:4318.
  endpoint: ""
  # grpc or http/protobuf.
  protocol: grpc
  signals:
    metrics: true
  # How often metrics are pushed, in seconds.
  metricsIntervalSeconds: 30
  # Extra resource attributes, as OTEL_RESOURCE_ATTRIBUTES: "key=value,key2=value2".
  resourceAttributes: ""
  tls:
    # Turn TLS off. Meant for a grpc endpoint without a scheme, but it also
    # turns TLS off for an https:// endpoint.
    insecure: false
    # Secret with the CA bundle that signs the collector certificate.
    caSecret:
      name: ""
      key: ca.crt
    # kubernetes.io/tls Secret for mutual TLS (tls.crt, tls.key).
    clientCertSecret:
      name: ""
  # Secret key holding OTEL_EXPORTER_OTLP_HEADERS, e.g. "authorization=Bearer <token>".
  headersSecret:
    name: ""
    key: headers

# Extra environment variables for the manager container, e.g. raw OTEL_* settings.
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
