kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The qualification profile requires every pod slice to carry pids.max=4096.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    podPidsLimit: 4096
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: STORAGE_HOST_PATH
        containerPath: /kind/manifests/default-storage.yaml
        readOnly: true
    labels:
      pgcopydb-operator.io/m7-run: RUN_ID
  - role: worker
    labels:
      pgcopydb-operator.io/m7-run: RUN_ID
  - role: worker
    labels:
      pgcopydb-operator.io/m7-run: RUN_ID
