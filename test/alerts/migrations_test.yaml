# Promtool unit tests for the chart's alert rules: per alert, one series over
# the threshold and one just under it, so every threshold and window is
# pinned. Run via `bin/promtool test rules test/alerts/migrations_test.yaml`.
rule_files:
  - ../../charts/pgcopydb-operator/rules/migrations.yaml

evaluation_interval: 1m

tests:
  # Failed for over 5m fires; Failed for only 2m is still pending.
  - interval: 1m
    input_series:
      - series: 'pgcopydb_migration_phase{namespace="default", name="bad", phase="Failed"}'
        values: "1x15"
      - series: 'pgcopydb_migration_phase{namespace="default", name="ok", phase="Failed"}'
        values: "_x7 1x7"
    alert_rule_test:
      - eval_time: 10m
        alertname: PgcopydbMigrationFailed
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              phase: Failed
              severity: critical
            exp_annotations:
              summary: Migration default/bad is Failed
              description: >-
                The operator stopped retrying. The Failed condition and the
                AttemptFailed events on the Migration carry the worker's last
                error.

  # A mismatch (0) for over 5m fires; one that is 2m old is still pending.
  - interval: 1m
    input_series:
      - series: 'pgcopydb_migration_verified{namespace="default", name="bad"}'
        values: "0x15"
      - series: 'pgcopydb_migration_verified{namespace="default", name="ok"}'
        values: "_x7 0x7"
    alert_rule_test:
      - eval_time: 10m
        alertname: PgcopydbMigrationVerificationFailed
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              severity: critical
            exp_annotations:
              summary: Migration default/bad failed verification
              description: >-
                pgcopydb compare found a schema or data mismatch between
                source and target. Do not cut applications over until the
                difference is explained.

  # One attempt per minute fires; two attempts in the whole window do not.
  - interval: 1m
    input_series:
      - series: 'pgcopydb_migration_phase{namespace="default", name="bad", phase="Cloning"}'
        values: "1x40"
      - series: 'pgcopydb_migration_attempts{namespace="default", name="bad"}'
        values: "0+1x40"
      - series: 'pgcopydb_migration_phase{namespace="default", name="ok", phase="Cloning"}'
        values: "1x40"
      - series: 'pgcopydb_migration_attempts{namespace="default", name="ok"}'
        values: "0x19 1x9 2x10"
    alert_rule_test:
      - eval_time: 40m
        alertname: PgcopydbMigrationRetrying
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              phase: Cloning
              severity: warning
            exp_annotations:
              summary: >-
                Migration default/bad burned three or more attempts in 30m
              description: >-
                The worker Job keeps failing and the operator keeps retrying
                with --resume. The Failed condition and the AttemptFailed
                events on the Migration carry the worker's last error.

  # A target size flat across the hour fires; any growth clears it.
  - interval: 5m
    input_series:
      - series: 'pgcopydb_migration_phase{namespace="default", name="bad", phase="Cloning"}'
        values: "1x20"
      - series: 'pgcopydb_migration_target_database_size_bytes{namespace="default", name="bad"}'
        values: "1000000x20"
      - series: 'pgcopydb_migration_phase{namespace="default", name="ok", phase="Cloning"}'
        values: "1x20"
      - series: 'pgcopydb_migration_target_database_size_bytes{namespace="default", name="ok"}'
        values: "1000000+1000000x20"
    alert_rule_test:
      - eval_time: 90m
        alertname: PgcopydbMigrationCloneStalled
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              phase: Cloning
              severity: warning
            exp_annotations:
              summary: >-
                Migration default/bad target grew by nothing in 1h of Cloning
              description: >-
                The clone is active but the target database size is flat.
                Check the worker pod logs and the source. The index and vacuum
                tail looks exactly like this and is not a stall, which is why
                the expression matches Cloning only: the operator reports that
                tail as Finalizing once it has seen the copy running.

  # The index and vacuum tail: target just as flat, but Finalizing rather than
  # Cloning, so the phase matcher has to keep it quiet. This is the case that
  # makes the alert's "matches Cloning only" promise mean anything; without it
  # every input series is Cloning and the matcher is unconstrained.
  - interval: 5m
    input_series:
      - series: 'pgcopydb_migration_phase{namespace="default", name="tail", phase="Finalizing"}'
        values: "1x20"
      - series: 'pgcopydb_migration_target_database_size_bytes{namespace="default", name="tail"}'
        values: "1000000x20"
    alert_rule_test:
      - eval_time: 90m
        alertname: PgcopydbMigrationCloneStalled
        exp_alerts: []

  # Lag above 64Mi for over 10m fires; lag exactly at 64Mi never does.
  - interval: 1m
    input_series:
      - series: 'pgcopydb_migration_replication_lag_bytes{namespace="default", name="bad"}'
        values: "100000000x20"
      - series: 'pgcopydb_migration_replication_lag_bytes{namespace="default", name="ok"}'
        values: "67108864x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PgcopydbMigrationReplicationLagHigh
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              severity: warning
            exp_annotations:
              summary: >-
                Migration default/bad is more than 64Mi behind the source for
                10m
              description: >-
                The target is not applying changes as fast as the source
                writes them. Sustained lag delays cutover and retains WAL on
                the source.

  # A drain that never reaches endpos fires after 15m; a replay that catches
  # up at 10m drops out of the expression and stays silent.
  - interval: 1m
    input_series:
      - series: 'pgcopydb_migration_endpos_lsn_bytes{namespace="default", name="bad"}'
        values: "5000x30"
      - series: 'pgcopydb_migration_replay_lsn_bytes{namespace="default", name="bad"}'
        values: "1000x30"
      - series: 'pgcopydb_migration_endpos_lsn_bytes{namespace="default", name="ok"}'
        values: "5000x30"
      - series: 'pgcopydb_migration_replay_lsn_bytes{namespace="default", name="ok"}'
        values: "0+500x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PgcopydbMigrationCutoverStalled
        exp_alerts:
          - exp_labels:
              namespace: default
              name: bad
              severity: critical
            exp_annotations:
              summary: >-
                Migration default/bad has not reached endpos 15m into cutover
              description: >-
                Cutover set an endpos but the target has not replayed up to
                it, so the migration cannot complete. Check the worker logs
                and the target's apply rate.
