# Docs site configuration (Material for MkDocs). Built and deployed by
# .github/workflows/docs.yml; build it locally with `mkdocs build --strict`.
# Cross-page links are page-relative .md paths so the same files render on
# GitHub and on the site.
site_name: pgcopydb-operator
repo_url: https://github.com/ydixken/pgcopydb-operator
docs_dir: docs

# research/ holds upstream issue drafts and superpowers/ local-only notes;
# neither is user documentation.
exclude_docs: |
  research/
  superpowers/

theme:
  name: material
  # Also the chart's Artifact Hub icon, served from this site because GitHub
  # Pages returns image/svg+xml where raw.githubusercontent.com returns text.
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Examples: examples.md
  - Operations:
      - Live migration: operations/live-migration.md
      - Verification: operations/verification.md
      - Suspend, retries, deletion: operations/lifecycle.md
      - Monitoring: operations/monitoring.md
      - Migrating into CloudNativePG: operations/cloudnativepg.md
      - Argo CD health checks: operations/argocd.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Prerequisites: reference/prerequisites.md
      - CRD reference: reference/api.md
      - Conditions and reasons: reference/conditions.md
      - pgcopydb option coverage: reference/coverage.md
  - Design:
      - Competitive comparison: design/comparison.md
